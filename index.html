<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Apri in Obsidian</title>
<style>
  :root { --bg:#f6f5f2; --card:#ffffff; --text:#1f1f1f; --muted:#6b6b6b; --line:#dedbd4; --accent:#6b4fd8; --accent-text:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --card:#202020; --text:#ececec; --muted:#9a9a9a; --line:#333; --accent:#8f7bff; --accent-text:#111; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); }
  .btn { display:inline-block; font-weight:600; text-decoration:none; border-radius:8px; padding:10px 16px; background:var(--accent); color:var(--accent-text); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <section id="opening" hidden>
    <h1 id="title">Apro la nota…</h1>
    <p>Se Obsidian non si apre da solo, tocca il pulsante.</p>
    <a id="open-btn" class="btn" href="#">Apri in Obsidian</a>
  </section>
  <section id="empty" hidden>
    <h1>Apri in Obsidian</h1>
    <p>Questa pagina apre le note di Obsidian dai link salvati in JW Library. Crea il link in Obsidian con il pulsante «Copia link JW Library».</p>
  </section>
</main>
<script>
// Link format: https://…/#<vault>/<note>
// Everything after "#" stays on the device: browsers never send it to the server.
const enc = s => encodeURIComponent(s).replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase());
const raw = location.hash.slice(1);
const cut = raw.indexOf("/");
let vault = "", note = "";
try {
  if (cut > 0) { vault = decodeURIComponent(raw.slice(0, cut)); note = decodeURIComponent(raw.slice(cut + 1)); }
} catch (e) { vault = note = ""; }

if (vault && note) {
  const url = "obsidian://open?vault=" + enc(vault) + "&file=" + enc(note);
  const label = note.replace(/ (\d+)\.(\d+)$/, " $1:$2");
  document.getElementById("opening").hidden = false;
  document.getElementById("title").textContent = "Apro " + label + "…";
  document.getElementById("open-btn").href = url;
  document.title = label;
  location.href = url;
} else {
  document.getElementById("empty").hidden = false;
}
</script>
</body>
</html>
